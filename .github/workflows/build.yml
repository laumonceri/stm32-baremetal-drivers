name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/laumonceri/stm32-drivers:latest

    steps:
      - uses: actions/checkout@v5

      - name: Build firmware
        run: make all

      - name: Run unit tests (with coverage already in image)
        run: make ut

      - name: Generate coverage report
        run: make coverage

      - name: Run cppcheck
        run: |
          cppcheck --enable=all \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            .

      - name: Check code formatting
        run: |
          git ls-files "*.c" "*.h" | xargs clang-format --dry-run -Werror

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report