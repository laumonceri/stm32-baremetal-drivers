name: Build

permissions:
  contents: write
  pages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install arm-none-eabi-gcc and cmocka
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        sudo apt-get install -y pkg-config libcmocka-dev lcov
    
    - name: Install analysis tools
      run: |
        sudo apt-get install -y cppcheck clang-format
      
    - name: Run cppcheck (static analysis)
      run: cppcheck --enable=all --suppress=missingInclude --suppress=missingIncludeSystem examples/

    - name: Check code formatting
      run: clang-format --dry-run -Werror examples/**/*.c
    
    - name: Install cmocka
      run: |
         sudo apt-get install -y build-essential pkg-config libcmocka-dev
    
    - name: Run host unit tests with coverage
      run: |
        set -eux

        make -C examples/gpio-blink clean

        HOST_COV_FLAGS="-fprofile-arcs -ftest-coverage -O0 -g"
        PKG_CFLAGS="$(pkg-config --cflags cmocka || true)"
        PKG_LIBS="$(pkg-config --libs cmocka || true)"

        HOST_CFLAGS="${PKG_CFLAGS} -I$(pwd)/drivers/gpio/include -I$(pwd)/platform/include -I$(pwd)/hw -I$(pwd)/tests -DUNIT_TEST_HOST -include $(pwd)/tests/mmio_stub.h ${HOST_COV_FLAGS}"
        HOST_LDFLAGS="${HOST_COV_FLAGS} ${PKG_LIBS}"

        make -C examples/gpio-blink HOST_CC=gcc HOST_COV_FLAGS="${HOST_COV_FLAGS}" \
          HOST_CFLAGS="${HOST_CFLAGS}" HOST_LDFLAGS="${HOST_LDFLAGS}" test

        # capture coverage from the test build directory
        lcov --directory examples/gpio-blink/build --capture --output-file examples/gpio-blink/coverage.info
        lcov --remove examples/gpio-blink/coverage.info '/usr/*' --output-file examples/gpio-blink/coverage.cleaned.info --ignore-errors unused
        genhtml examples/gpio-blink/coverage.cleaned.info --output-directory examples/gpio-blink/coverage-report

    - name: Upload coverage report
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: examples/gpio-blink/coverage-report
  
    - name: Build gpio-blink
      run: make -C examples/gpio-blink
    
    - name: Build uart-cli
      run: make -C examples/uart-cli