name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install arm-none-eabi-gcc
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Install analysis tools
      run: |
        sudo apt-get install -y cppcheck clang-format
      
    - name: Run cppcheck (static analysis)
      run: cppcheck --enable=all --suppress=missingInclude --suppress=missingIncludeSystem examples/

    - name: Check code formatting
      run: clang-format --dry-run -Werror examples/**/*.c
    
    - name: Install cmocka
      run: |
         sudo apt-get install -y build-essential pkg-config libcmocka-dev
    
    - name: Run host unit tests
      run: make -C examples/gpio-blink test
    
    - name: Build gpio-blink
      run: make -C examples/gpio-blink
    
    - name: Build uart-cli
      run: make -C examples/uart-cli