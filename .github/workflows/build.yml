name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install arm-none-eabi-gcc
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Install analysis tools
      run: |
        sudo apt-get install -y cppcheck clang-format
      
    - name: Run cppcheck (static analysis)
      run: cppcheck --enable=all examples/

    - name: Check code formatting
      run: clang-format --dry-run -Werror examples/**/*.c
    
    - name: Build gpio-blink
      run: make -C examples/gpio-blink
    
    - name: Build uart-cli
      run: make -C examples/uart-cli