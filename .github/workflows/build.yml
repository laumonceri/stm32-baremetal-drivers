name: Build

on:
  push:
    branches: [main]
  pull_requests:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install arm-none-eabi-gcc
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Build gpio-blink
      run: make -C examples/gpio-blink
    
    - name: Build uart-cli
      run: make -C examples/uart-cli
